# Plantilla restrictiva de CUPS. Acceso remoto apagado por defecto.
Listen localhost:631
Browsing No
WebInterface Yes
DefaultShared No
<Location />
  Order allow,deny
  Allow localhost
</Location>
<Location /admin>
  Order allow,deny
  Allow localhost
</Location>
<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow localhost
</Location>
# Para compartir en una LAN, agregar solo la subred privada autorizada.
# No usar Allow All ni exponer el puerto 631 directamente a Internet.