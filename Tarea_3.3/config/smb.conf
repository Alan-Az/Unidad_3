# Plantilla Samba para /srv/raid1/compartido.
# Cambiar los nombres de grupos y usuarios por los existentes en el servidor.
[global]
   workgroup = WORKGROUP
   server role = standalone server
   security = user
   map to guest = Never
   server min protocol = SMB2_10
   log file = /var/log/samba/%m.log
   max log size = 1000

[unidad3]
   path = /srv/raid1/compartido
   browseable = yes
   read only = no
   guest ok = no
   valid users = @unidad3_compartido
   force group = unidad3_compartido
   create mask = 0660
   directory mask = 2770
   inherit permissions = yes